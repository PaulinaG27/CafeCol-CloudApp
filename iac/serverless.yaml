service: cafecol-app

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 128
  timeout: 10
  logRetentionInDays: 7
  environment:
    DYNAMODB_TABLE: ${self:custom.tableName}
    STAGE: ${self:provider.stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - !GetAtt PedidosTable.Arn
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "arn:aws:logs:*:*:*"

custom:
  tableName: cafecol-pedidos-${self:provider.stage}

functions:
  pedidos:
    handler: lambda_function.lambda_handler
    description: "CafeCol - Gestion de pedidos de cafe"
    events:
      - httpApi:
          path: /pedidos
          method: POST
      - httpApi:
          path: /pedidos
          method: GET
      - httpApi:
          path: /pedidos
          method: OPTIONS

resources:
  Resources:

    PedidosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pedido_id
            AttributeType: S
        KeySchema:
          - AttributeName: pedido_id
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        Tags:
          - Key: Project
            Value: CafeCol

    FrontendBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: cafecol-frontend-prod-867049792825
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        Tags:
          - Key: Project
            Value: CafeCol

    FrontendBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref FrontendBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub "${FrontendBucket.Arn}/*"

    LambdaErrorAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: cafecol-lambda-errors-prod
        AlarmDescription: "Alerta si la Lambda tiene mas de 5 errores en 5 minutos"
        MetricName: Errors
        Namespace: AWS/Lambda
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanThreshold
        Dimensions:
          - Name: FunctionName
            Value: cafecol-app-prod-pedidos
        TreatMissingData: notBreaching

  Outputs:
    ApiEndpoint:
      Description: "URL de la API Gateway"
      Value: !Sub "https://${HttpApi}.execute-api.${self:provider.region}.amazonaws.com"
    FrontendUrl:
      Description: "URL del sitio web en S3"
      Value: !GetAtt FrontendBucket.WebsiteURL
    DynamoDBTable:
      Description: "Nombre de la tabla DynamoDB"
      Value: ${self:custom.tableName}
