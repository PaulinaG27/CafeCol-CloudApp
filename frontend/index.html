<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaféCol ☕</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream:   #f5efe6;
      --brown:   #3b1f0e;
      --caramel: #b5651d;
      --gold:    #d4a847;
      --espresso:#1a0a02;
      --foam:    #ede0d0;
      --accent:  #c0392b;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--espresso);
      color: var(--cream);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── GRAIN OVERLAY ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 999;
    }

    /* ── HERO ── */
    header {
      text-align: center;
      padding: 4rem 2rem 2rem;
      position: relative;
    }
    header .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 900;
      line-height: 0.9;
      color: var(--cream);
    }
    header h1 span {
      color: var(--gold);
      display: block;
    }
    header p.sub {
      margin-top: 1rem;
      color: #c9b49a;
      font-size: 0.95rem;
      font-weight: 300;
    }

    /* ── DIVIDER ── */
    .divider {
      width: 80px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 2rem auto;
    }

    /* ── MAIN GRID ── */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    @media (max-width: 640px) {
      main { grid-template-columns: 1fr; }
    }

    /* ── CARD ── */
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(212,168,71,0.2);
      border-radius: 4px;
      padding: 2rem;
      backdrop-filter: blur(4px);
    }
    .card.full { grid-column: 1 / -1; }

    .card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: var(--gold);
      margin-bottom: 1.25rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(212,168,71,0.2);
    }

    /* ── FORM ── */
    .field { margin-bottom: 1.25rem; }
    label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c9b49a;
      margin-bottom: 0.4rem;
    }
    input, select, textarea {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(212,168,71,0.25);
      border-radius: 3px;
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      padding: 0.65rem 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
    }
    select option { background: var(--espresso); }
    textarea { resize: vertical; min-height: 80px; }

    /* ── COUNTER ── */
    .qty-row {
      display: flex; align-items: center; gap: 0.75rem;
    }
    .qty-btn {
      width: 34px; height: 34px;
      background: rgba(212,168,71,0.15);
      border: 1px solid rgba(212,168,71,0.35);
      border-radius: 50%;
      color: var(--gold);
      font-size: 1.2rem;
      cursor: pointer;
      display: grid; place-items: center;
      transition: background 0.15s;
    }
    .qty-btn:hover { background: rgba(212,168,71,0.3); }
    #qty-display {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      min-width: 2ch; text-align: center;
    }

    /* ── SUBMIT ── */
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, var(--caramel), var(--gold));
      border: none;
      border-radius: 3px;
      color: var(--espresso);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin-top: 0.5rem;
    }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 2rem; right: 2rem;
      background: var(--brown);
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 1rem 1.5rem;
      color: var(--cream);
      font-size: 0.9rem;
      max-width: 280px;
      transform: translateY(120%);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 1000;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.error { border-color: var(--accent); }
    #toast strong { display: block; color: var(--gold); margin-bottom: 0.2rem; }

    /* ── ORDERS TABLE ── */
    #orders-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .order-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.75rem 1rem;
      background: rgba(0,0,0,0.25);
      border-radius: 3px;
      border-left: 3px solid var(--gold);
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .order-row .name { font-weight: 500; font-size: 0.9rem; }
    .order-row .meta { font-size: 0.78rem; color: #c9b49a; margin-top: 0.15rem; }
    .order-row .badge {
      font-size: 0.7rem;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      background: rgba(212,168,71,0.15);
      border: 1px solid rgba(212,168,71,0.35);
      color: var(--gold);
      white-space: nowrap;
    }
    .empty-state {
      text-align: center; padding: 2rem; color: #7a6555; font-size: 0.9rem;
    }

    /* ── LOADING SPINNER ── */
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: var(--espresso);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 0.4rem; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 2rem;
      color: #4a3528;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }
    footer span { color: var(--gold); }
  </style>
</head>
<body>

<header>
  <p class="eyebrow">☕ Bienvenido a</p>
  <h1>Café<span>Col</span></h1>
  <p class="sub">Pedidos en la nube · Serverless · Hecho con amor desde Colombia</p>
</header>
<div class="divider"></div>

<main>
  <!-- FORM -->
  <div class="card">
    <h2>Nuevo Pedido</h2>

    <div class="field">
      <label for="nombre">Nombre del Cliente</label>
      <input type="text" id="nombre" placeholder="Ej: María García" />
    </div>

    <div class="field">
      <label for="cafe">Tipo de Café</label>
      <select id="cafe">
        <option value="">-- Selecciona --</option>
        <option>Espresso</option>
        <option>Americano</option>
        <option>Cappuccino</option>
        <option>Latte</option>
        <option>Macchiato</option>
        <option>Frappé de Caramelo</option>
        <option>Tinto Colombiano</option>
      </select>
    </div>

    <div class="field">
      <label>Cantidad</label>
      <div class="qty-row">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <span id="qty-display">1</span>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>

    <div class="field">
      <label for="notas">Notas especiales</label>
      <textarea id="notas" placeholder="Sin azúcar, leche de almendra, temperatura extra..."></textarea>
    </div>

    <button class="btn-submit" id="btn-pedido" onclick="enviarPedido()">
      Hacer Pedido
    </button>
  </div>

  <!-- ORDERS -->
  <div class="card">
    <h2>Pedidos Recientes</h2>
    <div id="orders-list">
      <div class="empty-state">Aún no hay pedidos.<br/>¡Sé el primero!</div>
    </div>
  </div>
</main>

<div id="toast"></div>

<footer>
  CaféCol &copy; 2026 · Desplegado en <span>AWS S3 + Lambda + DynamoDB</span>
</footer>

<script>
  // ── CONFIG ─────────────────────────────────────────────────────────────────
  // Reemplaza esta URL con tu API Gateway endpoint después de desplegar
  const API_URL = 'https://ru8o2x3fwb.execute-api.us-east-1.amazonaws.com/pedidos';

  let qty = 1;

  function changeQty(delta) {
    qty = Math.max(1, Math.min(10, qty + delta));
    document.getElementById('qty-display').textContent = qty;
  }

  async function enviarPedido() {
    const nombre = document.getElementById('nombre').value.trim();
    const cafe   = document.getElementById('cafe').value;
    const notas  = document.getElementById('notas').value.trim();

    if (!nombre || !cafe) {
      showToast('⚠️ Por favor completa nombre y tipo de café.', true);
      return;
    }

    const btn = document.getElementById('btn-pedido');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Enviando...';

    const pedido = {
      nombre,
      cafe,
      cantidad: qty,
      notas,
      timestamp: new Date().toISOString()
    };

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(pedido)
      });

      if (!res.ok) throw new Error('Error del servidor');
      const data = await res.json();

      addOrderToUI({ ...pedido, id: data.pedido_id || Date.now() });
      resetForm();
      showToast(`✅ Pedido registrado! ID: ${data.pedido_id || '---'}`);
    } catch (err) {
      // En desarrollo sin backend, mostramos de todas formas en la UI
      addOrderToUI({ ...pedido, id: 'local-' + Date.now() });
      resetForm();
      showToast('📋 Pedido guardado localmente (sin API conectada)', false);
      console.warn('API no disponible:', err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Hacer Pedido';
    }
  }

  function addOrderToUI(pedido) {
    const list = document.getElementById('orders-list');
    const empty = list.querySelector('.empty-state');
    if (empty) empty.remove();

    const row = document.createElement('div');
    row.className = 'order-row';
    row.innerHTML = `
      <div>
        <div class="name">${escapeHtml(pedido.nombre)}</div>
        <div class="meta">${escapeHtml(pedido.cafe)} × ${pedido.cantidad}
          ${pedido.notas ? ' · ' + escapeHtml(pedido.notas) : ''}</div>
      </div>
      <span class="badge">Recibido</span>
    `;
    list.prepend(row);
  }

  function resetForm() {
    document.getElementById('nombre').value = '';
    document.getElementById('cafe').value = '';
    document.getElementById('notas').value = '';
    qty = 1;
    document.getElementById('qty-display').textContent = '1';
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.className = isError ? 'error' : '';
    t.innerHTML = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
</script>
</body>
</html>
